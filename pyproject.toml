[project]
name = "ssog"
version = "0.1.0"
description = "SSOG: attention as a steerable Gaussian field over relative position"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "flax>=0.8",
]

[project.optional-dependencies]
examples = [
    "optax>=0.2",
    "datasets>=2.18",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssog*"]
